<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Hub</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-page="catalog">
    <header class="navbar">
      <nav class="nav-container" aria-label="Main navigation">
        <a class="brand" href="index.html">🍽️ Recipe Hub</a>
        <div class="nav-links"><a href="index.html">Recipes Catalog</a><a href="shopping.html">Shopping List <span id="cart-count"></span></a></div>
      </nav>
    </header>
    <main class="container">
      <section class="page-heading"><h1>Recipe Catalog</h1><p>Find a recipe, choose servings, and build your shopping list.</p></section>
      <form id="search-form" class="search-form"><label class="sr-only" for="search-input">Search recipes</label><input id="search-input" class="search-input" type="search" placeholder="Search by recipe or ingredient" /><button class="btn" type="submit">Search</button></form>
      <div id="catalog-message" class="message" role="status"></div>
      <section id="recipe-grid" class="recipe-grid" aria-live="polite"></section>
    </main>
  </body>
</html>
