services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD must be set in .env}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:?SHOPPING_DB_PASSWORD must be set in .env}
    volumes:
      - ./db/init.sql:/db/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C -b
        -v CATALOG_DB_PASSWORD="$${CATALOG_DB_PASSWORD}"
        SHOPPING_DB_PASSWORD="$${SHOPPING_DB_PASSWORD}"
        -i /db/init.sql

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: >-
        mssql+pymssql://catalog_user:${CATALOG_DB_PASSWORD}@mssql:1433/catalog_db
      UI_ORIGIN: http://localhost:8080
      GIT_SHA: ${GIT_SHA:-local-compose}
    ports:
      - "8001:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  shopping:
    build:
      context: .
      dockerfile: services/shopping/Dockerfile
    environment:
      DATABASE_URL: >-
        mssql+pymssql://shopping_user:${SHOPPING_DB_PASSWORD}@mssql:1433/shopping_db
      CATALOG_URL: http://catalog:8000
      UI_ORIGIN: http://localhost:8080
      GIT_SHA: ${GIT_SHA:-local-compose}
    ports:
      - "8002:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ui:
    image: nginx:alpine
    depends_on:
      catalog:
        condition: service_healthy
      shopping:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro

volumes:
  mssql-data:
