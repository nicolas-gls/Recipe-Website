<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Recipe & Shopping App{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <script>
    // Utility functions for managing the shopping list in localStorage
    // Create a cart object with findIndex and push methods to manage the shopping list
    const cart = {
      items: getCart(),
      findIndex: function (recipeId) {
        return findInArray(this.items, recipeId)
      },
      push: function (item) {
        this.items.push(item)
        saveCart(this.items)
      },
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('recipe_cart') || '[]')
      } catch (e) {
        return []
      }
    }

    function saveCart(cart) {
      localStorage.setItem('recipe_cart', JSON.stringify(cart))
      updateNavShoppingLinks()
    }

    function updateNavShoppingLinks() {
      if (cart.items.length > 0) {
        const params = new URLSearchParams()
        cart.items.forEach((item) => params.append('r', `${item.id}:${item.servings}`))
        const targetUrl = `/shopping?${params.toString()}`
        document.querySelectorAll('a[href^="/shopping"]').forEach((link) => {
          link.href = targetUrl
        })
      }
    }
    function findInArray(array, recipeId) {
      for (let i = 0; i < array.length; i++) {
        if (array[i].id === recipeId) {
          return i
        }
      }
      return -1
    }

    function addToList(recipeId) {
      const input = document.getElementById(`servings-${recipeId}`)
      const servings = input ? parseInt(input.value, 10) : 1
      if (!isNaN(servings) && servings > 0) {
        const existingIdx = cart.findIndex(recipeId)
        if (existingIdx >= 0) {
          cart.items[existingIdx].servings += servings
        } else {
          cart.push({ id: recipeId, servings: servings })
        }
        saveCart(cart.items)
        alert('Recipe added to your shopping list!')
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      try {
        const cart = getCart()
        updateNavShoppingLinks()
      } catch (e) {}
    })
  </script>

  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="brand">🍽️ Recipe Hub</a>
        <div class="nav-links">
          <a href="/">Recipes Catalog</a>
          <a href="/shopping">Shopping List</a>
        </div>
      </div>
    </nav>
    <main class="container">{% block content %}{% endblock %}</main>
  </body>
</html>
