name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start ephemeral SQL Server
        shell: bash
        run: |
          set -euo pipefail

          MSSQL_SA_PASSWORD="$(openssl rand -hex 32)Aa1"
          CATALOG_DB_PASSWORD="$(openssl rand -hex 32)Aa1"
          SHOPPING_DB_PASSWORD="$(openssl rand -hex 32)Aa1"

          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "::add-mask::$CATALOG_DB_PASSWORD"
          echo "::add-mask::$SHOPPING_DB_PASSWORD"
          {
            echo "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD"
            echo "CATALOG_DB_PASSWORD=$CATALOG_DB_PASSWORD"
            echo "SHOPPING_DB_PASSWORD=$SHOPPING_DB_PASSWORD"
          } >> "$GITHUB_ENV"

          docker run --detach --name ci-mssql --network host \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest

          for attempt in {1..60}; do
            if docker exec ci-mssql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
              -Q "SELECT 1" -o /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs ci-mssql
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tooling and service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff PyYAML jsonschema openapi-spec-validator pip-audit bandit
          python -m pip install -r services/catalog/requirements-dev.txt
          python -m pip install -r services/shopping/requirements-dev.txt

      - name: Dependency vulnerability scan (SCA)
        run: >-
          pip-audit
          -r requirements.txt
          -r services/catalog/requirements.txt
          -r services/shopping/requirements.txt

      - name: Python security scan (SAST)
        run: >-
          bandit -r app services scripts
          -x '*/tests/*'
          -ll
          -ii

      - name: Lint Python sources
        run: ruff check services scripts --select E,F --ignore E501

      - name: Generate OpenAPI documents
        env:
          DATABASE_URL: mssql+pymssql://ci:ci@127.0.0.1:1433/catalog_db
        run: PYTHONPATH=services/catalog python scripts/generate_openapi.py catalog

      - name: Generate Shopping OpenAPI document
        env:
          DATABASE_URL: mssql+pymssql://ci:ci@127.0.0.1:1433/shopping_db
        run: PYTHONPATH=services/shopping python scripts/generate_openapi.py shopping

      - name: Ensure committed OpenAPI documents are current
        run: git diff --exit-code -- services/catalog/openapi.yaml services/shopping/openapi.yaml

      - name: Validate OpenAPI and system specification
        run: python scripts/validate_specs.py

      - name: Initialize SQL Server databases and logins
        run: >-
          docker run --rm --network host
          -v "${GITHUB_WORKSPACE}/db/init.sql:/db/init.sql:ro"
          -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD"
          -e "CATALOG_DB_PASSWORD=$CATALOG_DB_PASSWORD"
          -e "SHOPPING_DB_PASSWORD=$SHOPPING_DB_PASSWORD"
          --entrypoint /bin/bash
          mcr.microsoft.com/mssql/server:2022-latest
          -c
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b
          -v CATALOG_DB_PASSWORD="$CATALOG_DB_PASSWORD"
          SHOPPING_DB_PASSWORD="$SHOPPING_DB_PASSWORD" -i /db/init.sql'

      - name: Run migration and database health smoke checks
        run: |
          CATALOG_DATABASE_URL="mssql+pymssql://catalog_user:${CATALOG_DB_PASSWORD}@127.0.0.1:1433/catalog_db"
          SHOPPING_DATABASE_URL="mssql+pymssql://shopping_user:${SHOPPING_DB_PASSWORD}@127.0.0.1:1433/shopping_db"

          (
            cd services/catalog
            DATABASE_URL="$CATALOG_DATABASE_URL" PYTHONPATH=. python -c "from app.database import wait_for_database, check_read_write; from app.migrations import run_migrations; wait_for_database(); run_migrations(); check_read_write()"
          )
          (
            cd services/shopping
            DATABASE_URL="$SHOPPING_DATABASE_URL" PYTHONPATH=. python -c "from app.database import wait_for_database, check_read_write; from app.migrations import run_migrations; wait_for_database(); run_migrations(); check_read_write()"
          )

      - name: Test Catalog with coverage
        run: |
          cd services/catalog
          DATABASE_URL="mssql+pymssql://catalog_user:${CATALOG_DB_PASSWORD}@127.0.0.1:1433/catalog_db" \
          PYTHONPATH=. python -m pytest -q tests \
            --cov=app.catalog.services --cov-report=term-missing --cov-fail-under=70

      - name: Test Shopping and cross-seam flow with coverage
        run: |
          cd services/shopping
          DATABASE_URL="mssql+pymssql://shopping_user:${SHOPPING_DB_PASSWORD}@127.0.0.1:1433/shopping_db" \
          CATALOG_URL=http://127.0.0.1:9 \
          PYTHONPATH=. python -m pytest -q tests \
            --cov=app.shopping.services --cov-report=term-missing --cov-fail-under=70

      - name: Build Catalog image
        run: docker build -f services/catalog/Dockerfile -t recipe-catalog:ci .

      - name: Build Shopping image
        run: docker build -f services/shopping/Dockerfile -t recipe-shopping:ci .

      - name: Stop ephemeral SQL Server
        if: always()
        run: docker rm --force ci-mssql >/dev/null 2>&1 || true
