name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CiSqlPassword2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiSqlPassword2026!' -C -b -Q 'SELECT 1' -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    env:
      CATALOG_DB_PASSWORD: CiCatalogPassword2026!
      SHOPPING_DB_PASSWORD: CiShoppingPassword2026!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tooling and service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff PyYAML jsonschema openapi-spec-validator
          python -m pip install -r services/catalog/requirements-dev.txt
          python -m pip install -r services/shopping/requirements-dev.txt

      - name: Lint Python sources
        run: ruff check services scripts --select E,F --ignore E501

      - name: Generate OpenAPI documents
        env:
          DATABASE_URL: mssql+pymssql://ci:ci@127.0.0.1:1433/catalog_db
        run: PYTHONPATH=services/catalog python scripts/generate_openapi.py catalog

      - name: Generate Shopping OpenAPI document
        env:
          DATABASE_URL: mssql+pymssql://ci:ci@127.0.0.1:1433/shopping_db
        run: PYTHONPATH=services/shopping python scripts/generate_openapi.py shopping

      - name: Ensure committed OpenAPI documents are current
        run: git diff --exit-code -- services/catalog/openapi.yaml services/shopping/openapi.yaml

      - name: Validate OpenAPI and system specification
        run: python scripts/validate_specs.py

      - name: Initialize SQL Server databases and logins
        env:
          MSSQL_SA_PASSWORD: CiSqlPassword2026!
        run: >-
          docker run --rm --network host
          -v "${GITHUB_WORKSPACE}/db/init.sql:/db/init.sql:ro"
          -e "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD"
          -e "CATALOG_DB_PASSWORD=$CATALOG_DB_PASSWORD"
          -e "SHOPPING_DB_PASSWORD=$SHOPPING_DB_PASSWORD"
          --entrypoint /bin/bash
          mcr.microsoft.com/mssql/server:2022-latest
          -c
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b
          -v CATALOG_DB_PASSWORD="$CATALOG_DB_PASSWORD"
          SHOPPING_DB_PASSWORD="$SHOPPING_DB_PASSWORD" -i /db/init.sql'

      - name: Run migration and database health smoke checks
        env:
          CATALOG_DATABASE_URL: mssql+pymssql://catalog_user:${{ env.CATALOG_DB_PASSWORD }}@127.0.0.1:1433/catalog_db
          SHOPPING_DATABASE_URL: mssql+pymssql://shopping_user:${{ env.SHOPPING_DB_PASSWORD }}@127.0.0.1:1433/shopping_db
        run: |
          DATABASE_URL="$CATALOG_DATABASE_URL" PYTHONPATH=services/catalog python -c "from app.database import wait_for_database, check_read_write; from app.migrations import run_migrations; wait_for_database(); run_migrations(); check_read_write()"
          DATABASE_URL="$SHOPPING_DATABASE_URL" PYTHONPATH=services/shopping python -c "from app.database import wait_for_database, check_read_write; from app.migrations import run_migrations; wait_for_database(); run_migrations(); check_read_write()"

      - name: Test Catalog with coverage
        env:
          DATABASE_URL: mssql+pymssql://catalog_user:${{ env.CATALOG_DB_PASSWORD }}@127.0.0.1:1433/catalog_db
        run: >-
          PYTHONPATH=services/catalog python -m pytest -q services/catalog/tests
          --cov=app.catalog.services --cov-report=term-missing --cov-fail-under=70

      - name: Test Shopping and cross-seam flow with coverage
        env:
          DATABASE_URL: mssql+pymssql://shopping_user:${{ env.SHOPPING_DB_PASSWORD }}@127.0.0.1:1433/shopping_db
          CATALOG_URL: http://127.0.0.1:9
        run: >-
          PYTHONPATH=services/shopping python -m pytest -q services/shopping/tests
          --cov=app.shopping.services --cov-report=term-missing --cov-fail-under=70

      - name: Build Catalog image
        run: docker build -f services/catalog/Dockerfile -t recipe-catalog:ci .

      - name: Build Shopping image
        run: docker build -f services/shopping/Dockerfile -t recipe-shopping:ci .
